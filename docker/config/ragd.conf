listen=127.0.0.1
port=8787

# Persistent inside the locallightchat_data Docker volume.
db=/var/lib/locallightchat/data/rag/ragd.sqlite3

# =============================================================================
# Embeddings
# =============================================================================
# Intentionally empty by default. If llama_url is empty, the Docker entrypoint
# leaves ragd disabled and starts the rest of LocalLightChat normally.
# After changing this file, restart the container:
#   docker compose restart
llama_url=
embedding_model=Qwen3-Embedding-0.6B-Q8_0

# ragd calls:
#   <llama_url>/v1/embeddings
#
# IMPORTANT WHEN THE MODEL SERVER RUNS ON THE SAME HOST AS DOCKER
# -----------------------------------------------------------------------------
# 127.0.0.1 INSIDE the container is the container itself, not the Docker host.
# Therefore this normally does NOT reach a llama.cpp server running natively
# on the host:
#
#   llama_url=http://127.0.0.1:8080        # WRONG for a host-native service
#
# Use Docker's host alias instead:
#
#   llama_url=http://host.docker.internal:8080
#
# The docker-compose.yml in this package maps host.docker.internal to Docker's
# host gateway, so the same hostname can also be used on native Linux Docker.
#
# Native Linux caveat: a host service that listens ONLY on host 127.0.0.1 may
# still reject traffic arriving from Docker's bridge. This is a very common
# local-desktop setup. In that case make the service listen on an address Docker
# can reach, e.g. 0.0.0.0 or a suitable host/bridge address, while keeping the
# port protected by the host firewall if it should not be exposed to the LAN.
#
# Example llama.cpp host command (adjust binary/model/options as needed):
#   llama-server --host 0.0.0.0 --port 8080 ...
#
# Then use this in ragd.conf:
#   llama_url=http://host.docker.internal:8080
#
# Do NOT replace host.docker.internal with 127.0.0.1 unless the embedding server
# actually runs inside this same container.

# Example A: llama.cpp / another OpenAI-compatible embedding server running
# natively on the SAME HOST as Docker:
# llama_url=http://host.docker.internal:8080
# embedding_model=Qwen3-Embedding-0.6B-Q8_0
#
# Example B: embedding server on another machine in the LAN:
# llama_url=http://192.168.1.50:8080
# embedding_model=Qwen3-Embedding-0.6B-Q8_0
#
# Example C: OpenRouter embeddings using Qwen3 Embedding 4B.
# Model page: https://openrouter.ai/qwen/qwen3-embedding-4b
# OpenRouter endpoint: https://openrouter.ai/api/v1/embeddings
#
# ragd appends /v1/embeddings itself, therefore use https://openrouter.ai/api
# as the base URL (NOT https://openrouter.ai/api/v1).
# llama_url=https://openrouter.ai/api
# embedding_model=qwen/qwen3-embedding-4b
# llama_api_key=sk-or-v1-YOUR-KEY
#
# Any other service exposing an OpenAI-compatible /v1/embeddings endpoint can
# be used the same way: set its base URL, model id and (if needed) bearer key.

# Optional embedding-server bearer token. If unset, RAGD_LLAMA_API_KEY is used.
# llama_api_key=your-secret-key

# Alternative local embedding model example:
# embedding_model=Qwen3-Embedding-4B-Q4_K_M

# =============================================================================
# Chunking / retrieval
# =============================================================================

chunk_chars=1800
chunk_max_chars=2800
chunk_overlap=200

#chunk_chars=2400
#chunk_max_chars=3200
#chunk_overlap=300

embedding_batch=32

default_top_k=8
max_top_k=64

hybrid_dense_k=96
hybrid_bm25_k=32
hybrid_rrf_k=60

# =============================================================================
# Optional reranker
# =============================================================================
# Disabled by default so the empty default config is valid.
reranker_enabled=false
reranker_url=
reranker_model=Qwen3-Reranker-0.6B-Q8_0
# reranker_api_key=

# ragd calls:
#   <reranker_url>/v1/rerank
#
# The same host-network rule as above applies here. If a reranker runs natively
# on the Docker host, use host.docker.internal rather than 127.0.0.1.
#
# Example A: local reranker running natively on the Docker host:
# reranker_enabled=true
# reranker_url=http://host.docker.internal:8081
# reranker_model=Qwen3-Reranker-0.6B-Q8_0
#
# Example B: reranker on another LAN machine:
# reranker_enabled=true
# reranker_url=http://192.168.1.50:8081
# reranker_model=Qwen3-Reranker-0.6B-Q8_0
#
# Example C: OpenRouter reranking using Qwen3 Reranker 8B.
# Model page: https://openrouter.ai/qwen/qwen3-reranker-8b
# OpenRouter endpoint: https://openrouter.ai/api/v1/rerank
#
# ragd appends /v1/rerank itself, therefore use https://openrouter.ai/api
# as the base URL (NOT https://openrouter.ai/api/v1).
# reranker_enabled=true
# reranker_url=https://openrouter.ai/api
# reranker_model=qwen/qwen3-reranker-8b
# reranker_api_key=sk-or-v1-YOUR-KEY

# Optional hard cap for each document sent to the reranker, in UTF-8 bytes.
# Leave commented (or set to 0) for unlimited/current behavior.
# reranker_max_bytes=1500
