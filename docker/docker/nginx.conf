server {
    listen 80;
    server_name _;

    root /var/www/html;
    index index.html index.php;

    client_max_body_size 220M;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Uploaded files are persisted outside the webroot.
    # They are exposed intentionally because the app returns /uploads/<file> URLs.
    location /uploads/ {
        alias /var/lib/locallightchat/uploads/;
        try_files $uri =404;
        add_header X-Content-Type-Options nosniff;
    }

    # Never execute anything from uploaded files.
    location ~ ^/uploads/.*\.php$ {
        return 403;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param SCRIPT_NAME $fastcgi_script_name;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_buffering off;
        fastcgi_connect_timeout 999s;
        fastcgi_read_timeout 999s;
        fastcgi_send_timeout 999s;
    }

    location ~ /\. {
        deny all;
    }
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/nginx-selfsigned.crt;
    ssl_certificate_key /etc/nginx/certs/nginx-selfsigned.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/html;
    index index.html index.php;

    client_max_body_size 220M;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /uploads/ {
        alias /var/lib/locallightchat/uploads/;
        try_files $uri =404;
        add_header X-Content-Type-Options nosniff;
    }

    location ~ ^/uploads/.*\.php$ {
        return 403;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param SCRIPT_NAME $fastcgi_script_name;
        fastcgi_param HTTPS on;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_buffering off;
        fastcgi_connect_timeout 999s;
        fastcgi_read_timeout 999s;
        fastcgi_send_timeout 999s;
    }

    location ~ /\. {
        deny all;
    }
}
