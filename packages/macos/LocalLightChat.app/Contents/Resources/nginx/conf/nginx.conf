#user  nobody;
worker_processes  1;

#error_log  logs/error.log;
#pid        logs/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # HTTP Server auf Port 8081
    server {
        listen       127.0.0.1:8081;
        server_name  localhost;

        root   html;
        index  index.html index.htm index.php;

	location ~ \.(sqlite|db)$ {
            deny all;
            return 403;
        }


	location / {
            try_files $uri $uri/ =404;
        }

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9002;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
            
            fastcgi_buffering off;
            client_max_body_size 200M;
	    fastcgi_read_timeout 999s;
            fastcgi_send_timeout 999s;
	    fastcgi_connect_timeout 999s;
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root html;
        }
    }

    # HTTPS Server auf Port 8082
    server {
        listen       127.0.0.1:8082 ssl;
        server_name  localhost;

        ssl_certificate ssl/nginx-selfsigned.crt;
        ssl_certificate_key ssl/nginx-selfsigned.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
        ssl_prefer_server_ciphers on;

        root   html;
        index  index.html index.htm index.php;

	location ~ \.(sqlite|db)$ {
            deny all;
            return 403;
        }
	

        location / {
            try_files $uri $uri/ =404;
        }

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9002;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
            
            fastcgi_buffering off;
            client_max_body_size 200M;
	    fastcgi_read_timeout 999s;
            fastcgi_send_timeout 999s;
	    fastcgi_connect_timeout 999s;
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root html;
        }
    }
}
